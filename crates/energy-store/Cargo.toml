# SPDX-License-Identifier: MIT

[package]
name = "energy-store"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
getrandom = "0.4.3"
sha2 = "0.11.0"
chrono = "0.4"
gb = { path = "../gb" }
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "migrate", "macros", "runtime-tokio", "chrono"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
