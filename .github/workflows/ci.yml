# SPDX-License-Identifier: MIT
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify with isolated MariaDB
        run: bash deploy/docker-compose/test.sh
