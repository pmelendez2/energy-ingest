# SPDX-License-Identifier: MIT
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  gitleaks:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check publication security
        run: bash scripts/check-publication.sh
