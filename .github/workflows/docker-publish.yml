# SPDX-License-Identifier: MIT
name: Publish production Docker image
on:
  push:
    tags:
      - 'energy-ingest-v*'
permissions:
  contents: read
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release tag and provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^energy-ingest-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          expected="energy-ingest-v$(<release/VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "ERROR: tag differs from release/VERSION" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run isolated verification
        run: bash deploy/docker-compose/test.sh
      - name: Build production image for smoke testing
        run: |
          docker build -f docker/Dockerfile.prod \
            -t energy-ingest:release-check .
      - name: Inspect production image
        run: |
          bash scripts/check-prod-image.sh \
            energy-ingest:release-check
      - name: Audit image build and privacy boundaries
        run: bash scripts/audit-prod-release.sh energy-ingest:release-check
      - name: Scan production image for critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache/ \
            aquasec/trivy:0.65.0 \
            image \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --image-src docker \
            energy-ingest:release-check

      - name: Validate production runtime and protected secrets
        env:
          ENGY_TEST_IMAGE: energy-ingest:release-check
        run: bash scripts/test-prod-runtime.sh
      - name: Verify sanitized XML import and authenticated API
        env:
          ENGY_TEST_IMAGE: energy-ingest:release-check
        run: bash scripts/test-prod-e2e.sh
  arm64-smoke:
    needs: verify
    # Native ARM64 runner avoids QEMU-based Rust compilation.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 production image (no publication)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.prod
          platforms: linux/arm64
          push: false
          load: true
          tags: energy-ingest:arm64-release-check
          cache-from: type=gha,scope=energy-prod-arm64
          cache-to: type=gha,mode=max,scope=energy-prod-arm64
      - name: Inspect ARM64 platform and image files
        run: |
          arch="$(docker image inspect \
            energy-ingest:arm64-release-check \
            --format '{{.Architecture}}')"
          test "$arch" = arm64
          bash scripts/check-prod-image.sh \
            energy-ingest:arm64-release-check
      - name: Execute ARM64 admin entrypoint natively
        run: |
          docker run --rm --network none \
            energy-ingest:arm64-release-check --help
          if docker run --rm --network none \
            -e ENGY_RUN_USER=root -e ENGY_RUN_GROUP=root \
            energy-ingest:arm64-release-check --help; then
            echo 'ERROR: ARM64 image permitted root application UID' >&2
            exit 1
          fi
  publish:
    needs: [verify, arm64-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@v5
      - name: Require Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#energy-ingest-v}"
          {
            echo 'tags<<EOF'
            echo "pmelendez2/gb-energy-ingest:$version"
            echo "pmelendez2/gb-energy-ingest:sha-${GITHUB_SHA:0:12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 and arm64
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=min
          sbom: true
          # Reuse layers compiled on the native ARM64 runner.
          cache-from: |
            type=gha,scope=energy-prod-arm64
            type=gha,scope=energy-prod
          cache-to: type=gha,mode=max,scope=energy-prod
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "pmelendez2/gb-energy-ingest@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package customer installation files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#energy-ingest-v}"
          bash scripts/package-prod-release.sh "$version" dist
      - name: Publish official GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#energy-ingest-v}"
          archive="dist/energy-ingest-prod-${version}.zip"
          checksum="${archive}.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release already exists." >&2
            echo "Refusing to replace published assets." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$archive" "$checksum" \
            --verify-tag \
            --title "Energy Ingest ${version}" \
            --notes "Production Docker image: docker.io/pmelendez2/gb-energy-ingest:${version}. Download the ZIP and checksum, verify with SHA-256, extract, and follow docs/INSTALL_LINUX.md. Linux amd64 and arm64; Home Assistant integration is planned."
