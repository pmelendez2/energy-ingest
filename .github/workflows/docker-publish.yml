# SPDX-License-Identifier: MIT
name: Publish production Docker image
on:
  push:
    tags:
      - 'energy-ingest-v*'
permissions:
  contents: read
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^energy-ingest-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run isolated verification
        run: bash deploy/docker-compose/test.sh
      - name: Build production image for smoke testing
        run: |
          docker build -f docker/Dockerfile.prod \
            -t energy-ingest:release-check .
      - name: Inspect production image
        run: |
          bash scripts/check-prod-image.sh \
            energy-ingest:release-check
      - name: Validate production runtime and protected secrets
        env:
          ENGY_TEST_IMAGE: energy-ingest:release-check
        run: bash scripts/test-prod-runtime.sh
  publish:
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@v4
      - name: Require Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#energy-ingest-v}"
          {
            echo 'tags<<EOF'
            echo "pmelendez2/energy-ingest:$version"
            echo "pmelendez2/energy-ingest:sha-${GITHUB_SHA:0:12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 and arm64
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=energy-prod
          cache-to: type=gha,mode=max,scope=energy-prod
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "pmelendez2/energy-ingest@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
